# Weekly update pull requests, opened against dev like any other change.
# Minor and patch bumps come grouped per ecosystem to keep the noise down; majors come one by one.
version: 2

updates:
  # NuGet packages, all versioned centrally in Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  # Base images, including the static FFmpeg build that reads untrusted media: its CVE fixes
  # matter most. Digest pins are updated too.
  - package-ecosystem: docker
    directories:
      - /src/ConvertApi.Api
      - /src/ConvertApi.Worker
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Actions are pinned by commit SHA; Dependabot moves the SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
