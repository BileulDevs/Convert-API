# Every push: build (warnings are errors), formatting check, unit tests with coverage.
# Pull requests to main: integration tests too, against real PostgreSQL containers (Testcontainers).
# Pushes to main: the API and worker images are published to GitHub Container Registry.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a branch's run, but every commit on main keeps its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build, format and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The FFmpeg the worker image ships, taken from its Dockerfile (the one place its version is
      # pinned), so tests convert with the very same build. ffprobe comes along: tests use it.
      - name: Get FFmpeg
        run: |
          docker buildx build --target ffmpeg-binaries --output "type=local,dest=$RUNNER_TEMP/ffmpeg" \
            -f src/ConvertApi.Worker/Dockerfile .
          chmod +x "$RUNNER_TEMP/ffmpeg/ffmpeg" "$RUNNER_TEMP/ffmpeg/ffprobe"
          # Fail here rather than let the FFmpeg tests skip themselves for want of a binary.
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -hide_banner -version
          echo "FFMPEG_PATH=$RUNNER_TEMP/ffmpeg/ffmpeg" >> "$GITHUB_ENV"

      - run: dotnet restore ConvertApi.slnx
      - run: dotnet build ConvertApi.slnx --configuration Release --no-restore
      - run: dotnet format ConvertApi.slnx --verify-no-changes --no-restore

      - name: Unit tests
        run: >
          dotnet test --project tests/ConvertApi.UnitTests --configuration Release --no-build
          --results-directory "$GITHUB_WORKSPACE/TestResults"
          -- --coverage --coverage-output-format cobertura --coverage-output unit.cobertura.xml

      - name: Coverage summary
        if: always()
        run: bash .github/scripts/coverage-summary.sh "Unit tests" TestResults/unit.cobertura.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Integration tests
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - run: dotnet build tests/ConvertApi.IntegrationTests --configuration Release

      - name: Integration tests
        run: >
          dotnet test --project tests/ConvertApi.IntegrationTests --configuration Release --no-build
          --results-directory "$GITHUB_WORKSPACE/TestResults"
          -- --coverage --coverage-output-format cobertura --coverage-output integration.cobertura.xml

      - name: Coverage summary
        if: always()
        run: bash .github/scripts/coverage-summary.sh "Integration tests" TestResults/integration.cobertura.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  images:
    name: Publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # One publication at a time, in push order, so latest never lands on an older commit.
    concurrency:
      group: images
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # linux/amd64 only: the platform Azure Container Apps runs.
      # Tagged with the commit, to know exactly what runs where, and latest.
      - name: Build and push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for app in api worker; do
            project="src/ConvertApi.${app^}/Dockerfile"
            image="$registry/convertapi-$app"
            docker buildx build --platform linux/amd64 --push \
              --file "$project" \
              --tag "$image:$GITHUB_SHA" --tag "$image:latest" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              .
            echo "Published $image:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io
