# Local run without Aspire: docker compose up --build
# API and Scalar docs: http://localhost:5080/scalar
# Development API key (X-Api-Key header): cvt_devlocal_DevelopmentOnlyKeyDoNotUseInProd
# The API listens on 127.0.0.1 only: that key is public, so keep it off the network.
# PostgreSQL is not published at all. Its password comes from POSTGRES_PASSWORD in a .env file
# (git-ignored): copy .env.example to .env and set your own value. Nothing secret is committed.

name: convertapi

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: convertapi
      POSTGRES_USER: convertapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convertapi -d convertapi"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [db, jobs]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/ConvertApi.Api/Dockerfile
    image: convertapi-api
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__convertapi: Host=postgres;Database=convertapi;Username=convertapi;Password='${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}'
      Storage__Root: /files
    volumes:
      - files:/files
    depends_on:
      postgres:
        condition: service_healthy
    # db for the database, default for the published port and outgoing webhooks.
    networks: [db, default]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Scale out with: docker compose up --scale worker=3
  # The worker hands untrusted files to FFmpeg and ImageMagick, so it gets as little as possible:
  # no internet and no API (jobs is internal and holds only PostgreSQL), no Linux capabilities,
  # a read-only system, and bounded CPU, memory and processes.
  # Known limit: it shares the files volume and the database credentials with the API, so a
  # compromised worker could still alter other jobs' files; a per-job sandbox would close that.
  worker:
    build:
      context: .
      dockerfile: src/ConvertApi.Worker/Dockerfile
    image: convertapi-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__convertapi: Host=postgres;Database=convertapi;Username=convertapi;Password='${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}'
      Storage__Root: /files
      Conversion__WorkRoot: /work
    volumes:
      - files:/files
      # Scratch space for conversions, private to each worker container and dropped with it.
      - /work
    tmpfs:
      - /tmp:size=64m
    read_only: true
    # Reaps the FFmpeg processes of a conversion stopped mid-way.
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
          pids: 256
    # No swap on top of the memory limit.
    memswap_limit: 2g
    networks: [jobs]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

# Both internal (no internet). The API and the workers each reach PostgreSQL, never each other.
networks:
  db:
    internal: true
  jobs:
    internal: true

volumes:
  postgres-data:
  # Uploads and results, shared by the API and the workers.
  files:
